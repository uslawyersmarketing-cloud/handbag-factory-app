name: Inspect v13 Source
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source
        shell: bash
        run: |
          base64 --decode patch_v13/MainActivity.java.gz.b64 | gzip -d > MainActivity.java
          base64 --decode patch_v13/FactoryDb.java.gz.b64 | gzip -d > FactoryDb.java
          echo "=== SOURCE 1-220 ==="
          sed -n '1,220p' MainActivity.java
