name: Inspect v13 Source
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode source
        shell: bash
        run: |
          base64 --decode patch_v13/MainActivity.java.gz.b64 | gzip -d > MainActivity.java
          base64 --decode patch_v13/FactoryDb.java.gz.b64 | gzip -d > FactoryDb.java
          echo "=== METHODS ==="
          grep -nE "void (show|add|open|edit)|onBackPressed|OnBackPressed|addExpense|addAdvance|addDispatch|addProduction|addBrand|addWorker|addPayment|showWorkers|showExpenses|showDashboard|showProduction|showMaterials|showReports|showOrders" MainActivity.java || true
          echo "=== SCREENS / NAV ==="
          grep -nE "setContentView|render|screen|currentScreen|dashboard|Dashboard|header|toolbar|ScrollView|EditText|setSoftInputMode" MainActivity.java | head -n 250 || true
          echo "=== DB METHODS ==="
          grep -nE "public (long|int|Cursor|double|String)|delete|update|insert" FactoryDb.java || true
